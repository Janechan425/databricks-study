<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Databricks Mock Exam 2 — Offline</title><style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#17243a;background:#f3f5f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:20px}.header,.card{background:white;border-radius:14px;padding:23px;margin-bottom:15px;box-shadow:0 1px 9px #0d294014}h1{font-size:24px;margin:0 0 12px}h2{font-size:20px}.muted{color:#64748b}.stats{display:flex;gap:16px;flex-wrap:wrap}.track{height:9px;background:#e6ebf3;border-radius:9px;margin:14px 0}.fill{height:100%;background:#286ab4;border-radius:9px;width:0}.numbers{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0}.numbers button{min-width:35px;height:34px;background:#fff;border:1px solid #ccd5e2;border-radius:6px;cursor:pointer}.numbers .answered{background:#dbeafe}.numbers .current{outline:2px solid #286ab4}.stem{white-space:pre-wrap;line-height:1.7;margin:22px 0;font-size:17px}.opt{display:block;padding:13px;border:1px solid #d6dfe9;border-radius:8px;margin:9px 0;cursor:pointer;line-height:1.6}.opt:has(input:checked){background:#eaf3ff;border-color:#286ab4}input{accent-color:#286ab4;margin-right:12px}.btn{padding:11px 16px;border-radius:8px;border:1px solid #b8cce2;background:#fff;color:#215b9e;cursor:pointer}.primary{background:#286ab4;color:white;border-color:#286ab4}.btn:disabled{opacity:.4}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.feedback{background:#f5f7fb;border-radius:9px;padding:16px;margin-top:20px;line-height:1.65}.correct{color:#16713c}.incorrect{color:#b12638}.feedback p{margin:7px 0}.report{white-space:pre-wrap;font-family:inherit;line-height:1.5}code{background:#edf1f6;padding:1px 4px;border-radius:4px}table{border-collapse:collapse;width:100%;margin:10px 0}th,td{padding:9px;border-bottom:1px solid #e5e9ef;text-align:left}#summary{display:none}.header{position:sticky;top:0;z-index:2}@media(max-width:700px){.header{position:static}.wrap{padding:10px}.card,.header{padding:16px}}
</style></head><body><div class="wrap"><div class="header"><h1>Databricks Data Engineer Associate — Mock Exam 2</h1><div class="stats"><span>45 questions · Single answer</span><span>90 minutes</span><strong id="timer">90:00</strong><strong id="progress">0 / 45 answered</strong></div><div class="track"><div id="fill" class="fill"></div></div><div class="numbers" id="numbers"></div><div class="actions"><button class="btn" id="start">Start / Resume timer</button><button class="btn" id="pause">Pause</button><button class="btn primary" id="submit">Submit all & grade</button></div></div><div class="card" id="question"></div><div class="card" id="summary"></div></div>
<script>
const questions=[{"n":1,"d":"Medium","q":"An analyst notices that a Databricks SQL warehouse is taking 3 minutes to run the first query of the day but subsequent queries run in seconds. What is the most likely cause?","o":{"A":"The warehouse has a cold start delay because the compute nodes were terminated during the idle period","B":"The warehouse is running out of memory after the first query","C":"The first query always runs as a dry run without caching","D":"The SQL optimizer is recomputing all table statistics for the first query"},"k":"A","e":"SQL warehouses auto-stop after an idle period (defaults: 10 minutes for serverless, 45 minutes for pro and classic) to save cost. When a new query arrives, a stopped pro or classic warehouse must start again, which takes about 4 minutes. Serverless SQL warehouses start in about 2–6 seconds. Subsequent queries run fast because the cluster is already running."},{"n":2,"d":"Medium","q":"A data engineer accidentally ran `DELETE FROM customers WHERE 1=1` which deleted all rows. The table is named `customers` in Delta format. How can they recover the data?","o":{"A":"`INSERT INTO customers SELECT * FROM customers VERSION AS OF previous_version`","B":"`RESTORE TABLE customers TO VERSION AS OF previous_version`","C":"Contact Databricks Support — deleted data cannot be recovered from Delta tables","D":"Rerun the original data ingestion pipeline to recreate the data"},"k":"B","e":"`RESTORE TABLE ... TO VERSION AS OF` (or `TIMESTAMP AS OF`) is the correct command to restore a Delta table to a previous version. It is an atomic operation that restores the table by re-referencing the old data files. This works as long as `VACUUM` has not deleted the files for that version. Option A creates a new table rather than restoring in-place."},{"n":3,"d":"Medium","q":"A team runs a nightly ETL notebook on a shared all-purpose cluster that stays up all day. Nobody watches the run, and the notebook needs no R, GPU, or custom init script. The team wants to cut cost and follow Databricks guidance for unattended production work. Which compute should the scheduled job use?","o":{"A":"The same all-purpose cluster, with auto termination turned off so it is always ready","B":"A Pro SQL warehouse sized to the notebook's data volume","C":"A single-node all-purpose cluster dedicated to the job","D":"Serverless compute for jobs, or a jobs compute cluster that is created for each run and terminated afterwards"},"k":"D","e":"For a nightly ETL notebook with no one watching, Databricks points to **serverless jobs** or **jobs compute**. Jobs compute is created for the run and terminated at the end, so you pay only while it runs, at the separate jobs price. Serverless bills DBUs for the work done with idle time minimized.\n\nAll-purpose compute is meant for interactive use and keeps billing while idle until auto termination, so turning auto termination off makes the cost worse. A SQL warehouse runs SQL for BI and ad hoc queries, not a general notebook job. Single-node compute suits small data and single-machine libraries, and it is still all-purpose compute."},{"n":4,"d":"Medium","q":"A data engineer must choose between COPY INTO and Auto Loader for ingesting files from cloud storage. Which statement correctly describes when to use each?","o":{"A":"COPY INTO is for structured files; Auto Loader is for unstructured files","B":"Auto Loader is deprecated; COPY INTO is the only recommended approach","C":"COPY INTO is idempotent and suits smaller, known file sets; Auto Loader suits continuous, large-scale ingestion with automatic file tracking","D":"Both are equivalent — the choice is purely based on personal preference"},"k":"C","e":"COPY INTO is a SQL command that idempotently loads files into a Delta table (skipping already-loaded files) — suitable for smaller or periodic batch loads from a known set of files. Auto Loader uses checkpointing and cloud notifications to efficiently handle millions of files continuously at scale, making it the recommended approach for streaming ingestion pipelines."},{"n":5,"d":"Easy","q":"An Auto Loader stream ingests JSON files with `cloudFiles.schemaLocation` set and no other schema options. Every column in the Bronze table, including `amount` and `event_ts`, ends up as `STRING`. What explains this?","o":{"A":"For JSON, CSV, and XML, Auto Loader infers columns as strings unless `cloudFiles.inferColumnTypes` is `true` or `cloudFiles.schemaHints` sets the types","B":"Auto Loader always writes `STRING` columns to Bronze tables, and types are applied only in Silver","C":"The schema location is corrupt, so Auto Loader fell back to strings","D":"JSON files can't carry numeric or timestamp values, so strings are the only option"},"k":"A","e":"When Auto Loader infers a schema for JSON, CSV, or XML, it reads every column as a string by default. Setting `cloudFiles.inferColumnTypes` to `true` infers real types, and `cloudFiles.schemaHints` (SQL DDL such as `amount DECIMAL(10,2)`) overrides or adds specific types.\n\nAvro and Parquet carry their types in the files, so they don't need this option. Nothing forces Bronze columns to be strings, and the behavior here is the documented default, not a fallback after an error."},{"n":6,"d":"Medium","q":"A data engineer writes `df = spark.read.format(\"delta\").load(\"/path/to/table\")`. What is the difference if they use `spark.readStream` instead of `spark.read`?","o":{"A":"`readStream` reads the entire table into memory at once; `read` reads in chunks","B":"`readStream` automatically converts the Delta table to a Kafka stream","C":"There is no difference — both return identical DataFrames","D":"`readStream` returns a streaming DataFrame that only processes new files/rows added since the last checkpoint"},"k":"D","e":"`spark.readStream.format(\"delta\").load(path)` creates a streaming DataFrame that treats the Delta table as a streaming source. It processes only new data (rows appended after the checkpoint) in each micro-batch. `spark.read` returns a static (batch) DataFrame representing the full table at the time of reading. The two APIs have fundamentally different execution semantics."},{"n":7,"d":"Medium","q":"A data engineer configures Auto Loader with `cloudFiles.schemaEvolutionMode = \"addNewColumns\"`. A new column appears in incoming JSON files. What happens?","o":{"A":"The stream fails and can't restart until the schema is manually updated","B":"The new column is silently ignored and not written to the Delta table","C":"The stream stops with an `UnknownFieldException` after recording the new column. When restarted, it adds the column to the schema and continues","D":"Auto Loader quarantines files with new columns for manual review"},"k":"C","e":"With `addNewColumns` (the default when no schema is provided), Auto Loader stops the stream with `UnknownFieldException`, saves the evolved schema, and picks up the new column on restart. That's why Databricks recommends running these streams in Lakeflow Jobs with retries. `failOnNewColumns` is the mode that stays failed until the schema is fixed, and `rescue` puts unexpected columns into `_rescued_data` ([schema evolution](https://docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/schema))."},{"n":8,"d":"Hard","q":"A data engineer sets a watermark on a streaming query: `withWatermark(\"event_time\", \"10 minutes\")`. What is the purpose of this watermark?","o":{"A":"Defines the maximum tolerated lateness for event-time-based aggregations, allowing late data up to 10 minutes after the window closes","B":"Ensures that data older than 10 minutes is deleted from the Delta table","C":"Buffers all incoming data for exactly 10 minutes before writing to the sink","D":"Limits the streaming query to process at most 10 minutes of historical data"},"k":"A","e":"Watermarks in Spark Structured Streaming define how late data can arrive and still be included in aggregations. A 10-minute watermark means data with an event_time up to 10 minutes behind the current watermark is included; older data is dropped. This allows Spark to bound the state size by eventually discarding old windows."},{"n":9,"d":"Medium","q":"An Auto Loader stream reads a landing directory that holds millions of files. Each micro-batch spends most of its time listing the directory. Which change does Databricks recommend for most workloads?","o":{"A":"Set `cloudFiles.useIncrementalListing` to `true`","B":"Raise `cloudFiles.maxFilesPerTrigger` to 100,000","C":"Replace Auto Loader with a scheduled `COPY INTO`","D":"Use file notification mode with file events enabled on the Unity Catalog external location"},"k":"D","e":"Directory listing, the default mode, lists the input directory on every micro-batch, which gets slow as the directory grows. Databricks recommends **file notification with file events**, enabled on the Unity Catalog external location, as more performant and scalable. You can switch modes across stream restarts and keep exactly-once processing.\n\n`cloudFiles.useIncrementalListing` is deprecated. `maxFilesPerTrigger` caps how many files each micro-batch takes, but discovery still has to list the directory. `COPY INTO` is meant for modest, known file sets, not millions of files."},{"n":10,"d":"Medium","q":"A data engineer compares two streaming trigger settings: `trigger(processingTime=\"1 minute\")` and `trigger(availableNow=True)`. Which scenario is best suited for each?","o":{"A":"`processingTime` for one-time batch runs; `availableNow` for continuous low-latency streams","B":"`processingTime` for continuous micro-batch streaming on a 1-minute interval; `availableNow` for scheduled jobs that process all pending data then stop","C":"Both are equivalent — the difference is only in the polling interval","D":"`processingTime` is deprecated; use `availableNow` for all streaming jobs"},"k":"B","e":"`trigger(processingTime=\"1 minute\")` runs micro-batches on a fixed 1-minute interval indefinitely — suitable for continuous, near-real-time streaming. `trigger(availableNow=True)` processes all currently available data and terminates — suitable for scheduled pipeline runs where a streaming source needs batch-style processing. Neither is deprecated."},{"n":11,"d":"Medium","q":"A data engineer has a CSV directory and wants to convert it to a managed Delta table in Unity Catalog. Which approach creates a properly managed Delta table?","o":{"A":"`CONVERT TO DELTA parquet.'/path/to/csv/'` — converts any format to Delta","B":"Delta tables can only be created from Parquet format; CSV must first be converted to Parquet","C":"`ALTER TABLE csv_table SET TYPE DELTA`","D":"`CREATE TABLE catalog.schema.table USING DELTA AS SELECT * FROM csv.'/path/'`"},"k":"D","e":"`CREATE TABLE ... USING DELTA AS SELECT * FROM csv.'/path/'` reads the CSV files and creates a new managed Delta table with the query results. `CONVERT TO DELTA` works only on Parquet-formatted directories (not CSV). `ALTER TABLE SET TYPE` is not valid Databricks SQL syntax. Delta tables can be created from any format via CTAS."},{"n":12,"d":"Medium","q":"A team sets up a Lakeflow Connect managed connector for continuous change data capture from SQL Server. Which component runs continuously in its own job and stages the change data before it is written to the destination?","o":{"A":"The Unity Catalog connection","B":"The destination streaming tables","C":"The ingestion gateway","D":"The ingestion pipeline"},"k":"C","e":"Database connectors add an **ingestion gateway**. It runs as a continuous task in its own job and stages change data for continuous change capture.\n\nThe **connection** is a Unity Catalog securable that stores the source's authentication details. The **ingestion pipeline** reads the staged changes and writes them to the destination, and the destination tables are **streaming tables** in the catalog and schema you pick."},{"n":13,"d":"Medium","q":"A data engineer needs to replace all data in a partition of a Delta table with new data, without affecting other partitions. Which SQL command accomplishes this?","o":{"A":"`DELETE FROM table WHERE partition_col = 'value'` followed by `INSERT INTO`","B":"`INSERT OVERWRITE table PARTITION (partition_col = 'value') SELECT ...`","C":"`TRUNCATE TABLE table` then `INSERT INTO table SELECT ...`","D":"`CREATE OR REPLACE TABLE table AS SELECT ...`"},"k":"B","e":"`INSERT OVERWRITE ... PARTITION (...)` replaces data in the specified partition atomically while leaving other partitions untouched. `TRUNCATE TABLE` removes all data from all partitions. `CREATE OR REPLACE TABLE` replaces the entire table. The `DELETE` + `INSERT` approach works but is not atomic — `INSERT OVERWRITE` is preferred for partition replacement."},{"n":14,"d":"Easy","q":"A data engineer has a column `price` stored as `STRING` type and needs to cast it to `DOUBLE` for calculations. Which SQL expression correctly performs this conversion?","o":{"A":"`CONVERT(price, DOUBLE)`","B":"`price::DOUBLE`","C":"`CAST(price AS DOUBLE)`","D":"`TO_DOUBLE(price)`"},"k":"C","e":"`CAST(column AS type)` is the standard SQL syntax for type conversion in Databricks SQL and Spark SQL. Databricks also supports the shorthand `column::type` (PostgreSQL-style). `CONVERT()` is valid in some SQL dialects but not Databricks SQL. `TO_DOUBLE()` is not a Databricks function."},{"n":15,"d":"Medium","q":"A data engineer writes `SELECT * FROM orders WHERE discount IS NOT NULL AND discount != 0`. A row with `discount = NULL` — will it be returned?","o":{"A":"Yes — `IS NOT NULL` matches NULL values","B":"Yes — `discount != 0` returns all non-zero values including NULL","C":"No — `IS NOT NULL` excludes NULL values; rows with NULL discount are filtered out","D":"A SQL error occurs because you cannot compare NULL with `!=`"},"k":"C","e":"`IS NOT NULL` filters out rows where the column contains NULL. Since both conditions are joined with `AND`, a row with `NULL` discount fails the `IS NOT NULL` check and is excluded. In SQL, `NULL != 0` evaluates to NULL (not TRUE), so NULL values are also excluded by the `!=` comparison — but `IS NOT NULL` already removes them first."},{"n":16,"d":"Medium","q":"A data engineer writes Delta table data using `df.write.format(\"delta\").mode(\"append\").save(path)`. What happens if the path already contains a Delta table with a different schema?","o":{"A":"The write succeeds and merges the schemas automatically","B":"The new data is silently dropped and the existing table is unchanged","C":"The existing table is overwritten with the new schema","D":"The write fails with a `AnalysisException` due to schema mismatch unless `mergeSchema` is enabled"},"k":"D","e":"Delta Lake enforces schema consistency by default. Appending data with a different schema throws an `AnalysisException`. To allow schema evolution during appends, enable `.option(\"mergeSchema\", \"true\")` which adds new columns from the source. Overwriting behavior requires `.mode(\"overwrite\")`, not `\"append\"`."},{"n":17,"d":"Easy","q":"A data engineer queries a table with millions of rows and needs to know the count of distinct values in a column. Which function returns this?","o":{"A":"`COUNT(DISTINCT column)`","B":"`COUNT(column)`","C":"`SUM(DISTINCT column)`","D":"`APPROX_COUNT_DISTINCT(column)`"},"k":"A","e":"`COUNT(DISTINCT column)` returns the exact number of distinct non-NULL values in the column. `COUNT(column)` counts non-NULL rows including duplicates. `SUM(DISTINCT column)` sums distinct numeric values, not counts. `APPROX_COUNT_DISTINCT()` uses HyperLogLog for an approximate count — faster for very large datasets but not exact."},{"n":18,"d":"Medium","q":"A data engineer uses `collect_list()` and `collect_set()` in a GROUP BY aggregation. What is the difference between these two functions?","o":{"A":"`collect_list` returns a sorted array; `collect_set` returns an unsorted array","B":"`collect_list` preserves duplicates in the array; `collect_set` returns only distinct values","C":"`collect_set` works on numeric types only; `collect_list` works on any type","D":"Both functions are identical — the names are aliases for the same behavior"},"k":"B","e":"`collect_list(col)` aggregates all values into an array including duplicates, preserving order. `collect_set(col)` aggregates into an array of unique values, with no guaranteed ordering. Use `collect_list` when duplicates and order matter; use `collect_set` when you only need distinct values."},{"n":19,"d":"Medium","q":"A data engineer receives a DataFrame with a column containing nested arrays of arrays (e.g., `[[1,2],[3,4]]`). Which function flattens this into a single-level array (e.g., `[1,2,3,4]`)?","o":{"A":"`explode()`","B":"`transform()`","C":"`array_join()`","D":"`flatten()`"},"k":"D","e":"`flatten(array_of_arrays)` converts a nested array (array of arrays) into a single flat array by concatenating the inner arrays. `explode()` creates one row per element — it doesn't flatten, it unnests. `array_join()` converts an array to a string. `transform()` applies a lambda to each element, producing an array of the same depth."},{"n":20,"d":"Hard","q":"A data engineer needs to delete records from a Delta table where a customer opted out, and also update other customers' status in the same operation. Which SQL command handles both in a single atomic operation?","o":{"A":"Run `DELETE` and `UPDATE` as separate transactions in sequence","B":"`TRUNCATE TABLE customers` then reinsert only the retained records","C":"`MERGE INTO customers USING opt_outs ON ... WHEN MATCHED AND condition THEN DELETE WHEN MATCHED AND other_condition THEN UPDATE SET ...`","D":"Use a Python loop to delete and update records one by one"},"k":"C","e":"Delta Lake's `MERGE` statement supports multiple `WHEN MATCHED` clauses with different conditions — one can trigger `DELETE` and another can trigger `UPDATE SET`. This executes atomically in a single pass over the data. Running `DELETE` and `UPDATE` as separate transactions is correct but not atomic as a combined unit. `TRUNCATE` and reinsert is expensive and error-prone."},{"n":21,"d":"Medium","q":"A DLT pipeline runs a full refresh. How does a full refresh differ from a standard pipeline update?","o":{"A":"A full refresh only processes files added in the last 24 hours","B":"A full refresh truncates all materialized tables and recomputes them from scratch using all source data","C":"A full refresh updates only the tables with failed expectations from the previous run","D":"A full refresh is identical to a standard update — the terminology is interchangeable"},"k":"B","e":"A full refresh in Delta Live Tables drops all data in the pipeline's materialized tables and recomputes everything from the original sources. This is useful after fixing pipeline logic or recovering from data corruption. A standard update (incremental) processes only new data since the last checkpoint. Full refreshes are more expensive since they reprocess all historical data."},{"n":22,"d":"Medium","q":"A DLT pipeline has an `EXPECT` constraint with no `ON VIOLATION` modifier. A record fails the constraint. What is the default behavior?","o":{"A":"The pipeline fails and stops processing","B":"The violating record is dropped silently","C":"The violating record is written to the output table and the violation is logged in the event log as a warning","D":"The violating record is written to a quarantine table for review"},"k":"C","e":"The default behavior of `EXPECT` without an `ON VIOLATION` modifier is `WARN` — all records (including violating ones) are written to the output table, and the number of violations is tracked in the DLT event log as metrics. To drop records, use `ON VIOLATION DROP ROW`. To fail the pipeline, use `ON VIOLATION FAIL UPDATE`."},{"n":23,"d":"Medium","q":"A data engineer uses `dbutils.widgets.text(\"start_date\", \"2024-01-01\")` in a notebook. What is the purpose of this widget?","o":{"A":"Displays a text message at the top of the notebook output","B":"Logs the value `\"2024-01-01\"` to the Databricks audit trail","C":"Creates a permanent database variable that persists across cluster restarts","D":"Creates a parameterized input that can be overridden when running the notebook as a job"},"k":"D","e":"`dbutils.widgets` creates interactive input controls (text boxes, dropdowns, etc.) in the notebook UI. When the notebook is run as a Lakeflow Job, the widget value can be overridden via job parameters or the `notebookParams` API. This makes notebooks parameterizable and reusable across different date ranges or environments."},{"n":24,"d":"Medium","q":"In a Lakeflow Job, the `ingest` task publishes the number of new rows with `dbutils.jobs.taskValues.set(key=\"rows_loaded\", value=rows)`. The `transform` task should run only when `rows_loaded` is greater than 0, and a `notify_no_data` task should run otherwise. How should the job be built?","o":{"A":"Add an If/else condition task after `ingest` that compares `{{tasks.ingest.values.rows_loaded}}` `>` `0`. Make `transform` depend on its `(true)` outcome and `notify_no_data` on its `(false)` outcome","B":"Make both tasks depend on `ingest`, and have `transform` exit early in code when no rows were loaded","C":"Use a For each task over `rows_loaded`","D":"Set `notify_no_data`'s **Run if** to **At least one failed**, and make `ingest` fail when no rows are loaded"},"k":"A","e":"The **If/else condition** task branches a job on a boolean expression. Operands can be literals, job parameters, or task values such as `{{tasks.ingest.values.rows_loaded}}`, and downstream tasks depend on its `(true)` or `(false)` outcome. `>` compares numbers, while `==` and `!=` compare strings.\n\nAn early exit in code still starts `transform` and hides the branch from the job graph. For each loops over an array of inputs. It doesn't branch. Making a task fail on purpose to drive control flow turns a normal empty day into a failed run."},{"n":25,"d":"Medium","q":"A data engineer uses `dbutils.notebook.run(\"./child_notebook\", timeout_seconds=300, arguments={\"date\": \"2024-01-15\"})`. What does this accomplish?","o":{"A":"Runs the child notebook synchronously in the current cluster, passing the date argument as a widget value","B":"Runs the child notebook asynchronously in a separate Databricks job","C":"Schedules the child notebook to run at the specified timeout in 300 seconds","D":"Creates a permanent link between the parent and child notebook that runs on every commit"},"k":"A","e":"`dbutils.notebook.run()` executes another notebook synchronously on the current cluster with a timeout. The `arguments` dictionary sets widget values in the child notebook. It blocks until the child completes or times out. Unlike `%run`, the child notebook runs in an isolated scope and its variables are not imported into the parent."},{"n":26,"d":"Medium","q":"A data engineer uses task values to pass a dynamically computed date from Task A to Task B in a multi-task Lakeflow Job. Which `dbutils` functions are used to set and retrieve the value?","o":{"A":"`dbutils.jobs.set(\"key\", value)` in Task A; `dbutils.jobs.get(\"key\")` in Task B","B":"`dbutils.jobs.taskValues.set(key=\"key\", value=value)` in Task A; `dbutils.jobs.taskValues.get(taskKey=\"task_a\", key=\"key\")` in Task B","C":"`dbutils.widgets.set(\"key\", value)` in Task A; `dbutils.widgets.get(\"key\")` in Task B","D":"Write the value to DBFS in Task A; read from DBFS in Task B"},"k":"B","e":"`dbutils.jobs.taskValues.set(key=..., value=...)` publishes a value from the current task. Downstream tasks read it with `dbutils.jobs.taskValues.get(taskKey=..., key=...)`, or reference it as `{{tasks.\u003ctask>.values.\u003ckey>}}` ([task values](https://docs.databricks.com/aws/en/jobs/task-values)). Widgets are for parameterizing notebooks, not passing values between tasks. DBFS would work but is an anti-pattern compared to the built-in task values API."},{"n":27,"d":"Medium","q":"A Gold job reads `main.silver.orders`, which Team A refreshes, and `main.silver.customers`, which Team B refreshes. Both teams finish at different, unpredictable times. The Gold job should run once both tables have been refreshed, with no polling. Which trigger fits?","o":{"A":"A scheduled trigger at 06:00 every day","B":"A table update trigger on both tables with **Any table is updated**","C":"A file arrival trigger on the Silver schema's storage location","D":"A table update trigger on both tables with **All tables are updated**"},"k":"D","e":"A **table update trigger** starts a run when monitored Unity Catalog tables change, with no compute running in between. When it monitors several tables, **All tables are updated** waits until every one of them has changed, which suits a job that needs every input fresh.\n\n**Any table is updated** would start after the first team finishes, with the other input still stale. A fixed 06:00 schedule can run before either team is done. File arrival triggers watch for new files in a volume or external location, not table refreshes. The job's **Run as** principal needs `SELECT` on each table, plus `USE CATALOG` and `USE SCHEMA`, or the trigger can't evaluate."},{"n":28,"d":"Medium","q":"A production Lakeflow Job runs a task that occasionally takes much longer than usual due to data volume spikes. To prevent the job from running indefinitely, which configuration should the engineer set?","o":{"A":"Retry policy with maximum retries set to 1","B":"Task timeout — the maximum time in seconds a task is allowed to run before it is cancelled","C":"Cluster autotermination minutes on the job cluster","D":"Maximum concurrent runs set to 1"},"k":"B","e":"Task timeout defines the maximum wall-clock time a task is allowed to run before Databricks automatically cancels it and marks the task as failed. This prevents runaway jobs from consuming resources indefinitely. Retry policy controls what happens after failure. Autotermination applies to idle clusters, not running tasks. Max concurrent runs controls parallel job instances."},{"n":29,"d":"Medium","q":"A Lakeflow Job multi-task job has tasks A → B → C (sequential dependency). Task B fails. What is the default behavior for Task C?","o":{"A":"Task C runs anyway, using the last successful output from Task B","B":"Task C doesn't run and is marked `Upstream failed` because its dependency failed","C":"Task C waits indefinitely for Task B to be manually retried","D":"The entire job reruns from Task A automatically"},"k":"B","e":"When an upstream task fails in a Lakeflow Job, downstream tasks with the default Run if condition (*All succeeded*) are marked `Upstream failed`. Databricks does not run dependent tasks if their dependencies failed. If the job has retry configured, the failed task is retried first. Task C is not retried or rerun automatically."},{"n":30,"d":"Easy","q":"A data engineer wants to version control notebooks using Git and collaborate with teammates via pull requests. Which Databricks feature supports this workflow?","o":{"A":"Databricks Archives — export notebooks to ZIP format for external storage","B":"Lakeflow Jobs — tracks job run history as a proxy for code versions","C":"Databricks File System — stores notebook files in DBFS with version history","D":"Databricks Git folders (formerly Repos) — connects workspace folders to a remote Git repository"},"k":"D","e":"Databricks Git folders (formerly Repos) integrates workspace folders directly with remote Git repositories (GitHub, GitLab, Azure DevOps, etc.). Engineers can commit, push, pull, create branches, and collaborate via pull requests without leaving the Databricks interface. DBFS does not provide version control. Workflows tracks job runs, not code changes."},{"n":31,"d":"Hard","q":"A bundle declares the variable `catalog` with `default: dev`, and the `prod` target sets `variables.catalog: prod`. The CI runner exports `BUNDLE_VAR_catalog=staging` and then runs `databricks bundle deploy -t prod` with no `--var` option. Which value does `${var.catalog}` resolve to?","o":{"A":"`staging`","B":"`prod`","C":"`dev`","D":"The deploy fails because the variable is defined in two places"},"k":"A","e":"Bundle variables are resolved at deploy time, in this order of precedence: the `--var` CLI option, then the `BUNDLE_VAR_\u003cname>` environment variable, then `.databricks/bundle/\u003ctarget>/variable-overrides.json`, then the value under the target, and last the top-level `default`.\n\nNo `--var` was passed, so the environment variable wins over the target-level `prod` value. This is a common reason a target's value seems to be ignored. Defining a value in several places is normal, and precedence decides which one is used."},{"n":32,"d":"Easy","q":"A CI step runs `databricks bundle deploy` with no `-t` option. The bundle defines `dev`, `test`, and `prod` targets, and the code ends up in the dev workspace instead of prod. Why?","o":{"A":"Without `-t`, the bundle deploys to the target marked `default: true`","B":"Without `-t`, the bundle deploys to every target in alphabetical order","C":"`databricks bundle deploy` always deploys to dev, and prod requires `databricks bundle run`","D":"The CI runner's service principal can access only the dev workspace"},"k":"A","e":"When no target is given, the CLI uses the target marked `default: true`, which is usually `dev`. CI pipelines should always pass `-t \u003ctarget>` explicitly.\n\nA deploy goes to one target, not to all of them. `deploy` works for any target, and `run` starts a deployed job, pipeline, app, or script. Nothing in the scenario points to a permission problem: the deploy succeeded, just to the wrong target."},{"n":33,"d":"Medium","q":"Which behavior applies to a bundle target set to `mode: production`?","o":{"A":"Resource names get a `[dev \u003cuser>]` prefix, and schedules and triggers are paused","B":"Clusters can be overridden with `--cluster-id` so production runs can reuse a developer's cluster","C":"Validations check `run_as` and permissions, reject cluster overrides, and require the Git branch to match the target's configured branch","D":"The deployment lock is disabled so several pipelines can deploy at once"},"k":"C","e":"`mode: production` adds safety checks: it validates `run_as`, `permissions`, and that paths aren't user-specific, doesn't allow a `cluster_id` override, and requires the Git branch to match the target's configured branch (`--force` overrides that check). A service principal is the recommended identity.\n\nThe name prefix, paused schedules, and allowed cluster overrides all belong to `mode: development`. The deployment lock is enabled in production mode and disabled in development mode."},{"n":34,"d":"Medium","q":"A production Lakeflow Job points at a notebook inside an engineer's personal Git folder. After the engineer switches to a branch that doesn't contain the notebook and then switches back, the job fails because the notebook now has a new ID. What is the recommended practice?","o":{"A":"Pin the job to the notebook's old URL","B":"Forbid branch switching in that Git folder","C":"Have every engineer share one Git folder for production","D":"Have CI deploy a bundle from the merged `main` branch to the production workspace, run as a service principal"},"k":"D","e":"Switching branches can delete workspace assets that the new branch doesn't contain. Switching back recreates them with new IDs and URLs, so any job that points at a personal Git folder is fragile.\n\nProduction jobs should run from a bundle that CI deploys from the merged branch, using a service principal. The old URL no longer exists. Blocking branch switches defeats the purpose of Git folders, and the docs advise against sharing one Git folder between people."},{"n":35,"d":"Hard","q":"A data engineer examines the Spark UI after a job completes and sees one task taking 10× longer than all other tasks. What does this indicate?","o":{"A":"The cluster ran out of memory and had to spill to disk","B":"The Photon engine failed to accelerate that specific task","C":"A data skew problem — one partition contains significantly more data than others","D":"Network latency caused a delay in fetching data from cloud storage"},"k":"C","e":"A single slow task (stragglers) in the Spark UI typically indicates data skew — one partition has significantly more rows than others, causing one executor to do disproportionately more work. Solutions include salting keys, using `skewHint`, or repartitioning. Memory spill shows in the Spark UI as shuffle spill metrics, not as a single slow task."},{"n":36,"d":"Hard","q":"A data engineer runs `OPTIMIZE transactions ZORDER BY (customer_id, transaction_date)`. How does Z-ORDER with multiple columns differ from Z-ORDER with a single column?","o":{"A":"Z-ORDER with multiple columns is invalid — only one column is allowed","B":"Z-ORDER with multiple columns co-locates data that shares similar values across all specified columns, optimizing queries filtering on any combination of those columns","C":"Z-ORDER applies the first column's ordering first; the second column only applies within ties","D":"Each column is independently Z-ORDERed in separate file groups"},"k":"B","e":"Z-ORDER with multiple columns uses a space-filling curve to interleave the sort dimensions, co-locating rows that are similar in all specified columns simultaneously. This enables data skipping for queries filtering on `customer_id`, `transaction_date`, or both together. Option C describes a lexicographic sort, which is not how Z-ORDER works."},{"n":37,"d":"Easy","q":"A data engineer wants to receive an email when a Lakeflow Job fails. Where is this configured?","o":{"A":"In the cluster configuration under \"Termination Notifications\"","B":"In the Databricks workspace admin settings under \"Global Notifications\"","C":"Through a separate alerting notebook that monitors job status via the Jobs API","D":"In the job's \"Notifications\" settings, where email addresses can be added for failure, success, or start events"},"k":"D","e":"Lakeflow Jobs has a built-in \"Notifications\" section in the job configuration where you can specify email addresses to notify on job start, job success, job failure, and task failure events. This is configured per-job, not globally. A separate monitoring notebook is an alternative but unnecessary when built-in notifications are available."},{"n":38,"d":"Hard","q":"A report notebook runs `pdf = spark.table(\"main.silver.events\").toPandas()` on a 200-million-row table. The run fails with `java.lang.OutOfMemoryError` on the driver, and the notebook detaches. The engineer doubles the number of workers, and the error comes back. What is the right fix?","o":{"A":"Double the number of workers again, until the cluster has enough total memory","B":"Keep the data distributed: aggregate or filter in Spark and collect only the small result (or write the output to a table), raising `spark.driver.memory` only if still needed","C":"Raise `spark.sql.shuffle.partitions` so each partition is smaller","D":"Enable autoscaling so Databricks adds workers when memory runs low"},"k":"B","e":"A driver OOM usually comes from pulling data to the driver with `collect()` or `toPandas()`. Workers don't add driver memory, so more workers or autoscaling can't fix it. Aggregate in Spark first, for example `groupBy(\"event_type\").count().toPandas()`, or write results to a table and use `display()` or `limit()`.\n\nMore shuffle partitions help executor OOM and spill from oversized partitions, not a driver that is holding the whole table. Raising `spark.driver.memory` at the compute level is a last resort when the result really must live on the driver."},{"n":39,"d":"Easy","q":"A data engineer needs to store a small reference file that will be accessed by Spark jobs in a Databricks workspace. The file must be governed by Unity Catalog and accessible from any Unity Catalog-enabled compute without mount configuration. Which storage location is most appropriate?","o":{"A":"Cloud object storage (S3/ADLS) with manual mount configuration per cluster","B":"DBFS root, which is mounted on every cluster automatically","C":"Local disk of the driver node — fastest access for small files","D":"A Unity Catalog volume, referenced by a path such as `/Volumes/main/ref/files/lookup.csv`"},"k":"D","e":"Unity Catalog volumes govern non-tabular files with UC privileges (`READ VOLUME` / `WRITE VOLUME`) and are reachable from UC-enabled compute through `/Volumes/...` paths. DBFS root and mounts are deprecated, and Databricks recommends UC volumes, external locations, or workspace files instead ([What is DBFS?](https://docs.databricks.com/aws/en/dbfs/)). Local driver disk is ephemeral and not shared with other nodes."},{"n":40,"d":"Medium","q":"A company migrates from an existing Hive metastore to Unity Catalog. What is the key advantage of Unity Catalog over the workspace-level Hive metastore?","o":{"A":"Unity Catalog provides centralized governance, fine-grained access control, and data lineage across multiple workspaces","B":"Unity Catalog stores data in a different file format for better performance","C":"Unity Catalog eliminates the need for any access control configuration","D":"Unity Catalog is faster because it uses an in-memory metadata cache"},"k":"A","e":"Unity Catalog provides a centralized governance layer that spans multiple Databricks workspaces and accounts. It offers fine-grained table, column, and row-level security, automated data lineage tracking, and audit logs — none of which are available in the per-workspace Hive metastore. The metastore stores metadata; performance depends on the underlying data files."},{"n":41,"d":"Easy","q":"A data engineer creates a new Delta table in Unity Catalog using `CREATE TABLE catalog.schema.table`. Who automatically becomes the table owner?","o":{"A":"The workspace admin who configured Unity Catalog","B":"The metastore admin","C":"The user who created the table (the current session's identity)","D":"Ownership is not assigned until explicitly set with `ALTER TABLE ... OWNER TO`"},"k":"C","e":"In Unity Catalog, the user who creates an object (table, schema, catalog) automatically becomes its owner. Owners have full control over the object, including the ability to grant privileges to others and transfer ownership. Ownership can be transferred using `ALTER TABLE ... OWNER TO new_owner`."},{"n":42,"d":"Medium","q":"A data engineer needs to restrict certain users from seeing the full value of a `ssn` (social security number) column, showing only the last 4 digits instead. Which Unity Catalog feature implements this?","o":{"A":"Row-level security policy with a `WHERE` clause filter","B":"Column masking policy that replaces the column value with a masked version based on user identity","C":"Dynamic view with `CASE WHEN current_user() = 'admin' THEN ssn ELSE NULL END`","D":"Remove the column from the table and create a separate table for privileged users"},"k":"B","e":"Unity Catalog column masking policies apply a transformation function to a column's value based on the requesting user's identity or group membership. For example, showing only `'***-**-' || RIGHT(ssn, 4)` to non-privileged users while showing the full value to authorized users. Dynamic views (option C) also work but require maintaining a separate view object. Column masking is the purpose-built Unity Catalog feature."},{"n":43,"d":"Hard","q":"Hundreds of tables across the schema `main.silver` have email columns tagged with the governed tag `pii = email`, and new tables are added every week. The governance team wants every tagged email column masked for the `analysts` group, now and in future tables, using one definition that table owners can't remove. What should they create?","o":{"A":"An ABAC policy created with `CREATE POLICY ... ON SCHEMA main.silver COLUMN MASK \u003cfunction> TO analysts FOR TABLES MATCH COLUMNS has_tag_value('pii', 'email')`","B":"A dynamic view over each table that hides the email column","C":"A column mask on each email column, applied with `ALTER TABLE ... ALTER COLUMN ... SET MASK`","D":"A row filter on each table that returns `FALSE` for the `analysts` group"},"k":"A","e":"**ABAC policies** evaluate governed tags. One policy attached to a catalog or schema masks every matching column in current and future tables, and because higher-level admins define it, table owners can't override or remove it. ABAC needs Databricks Runtime 16.4+ or serverless compute.\n\nPer-column masks and dynamic views have to be repeated for every new table, and owners can change them. A row filter removes whole rows instead of masking a column."},{"n":44,"d":"Medium","q":"A data engineer creates an external table in Unity Catalog pointing to an S3 path. What happens to the underlying data files when the table is dropped with `DROP TABLE`?","o":{"A":"The data files are deleted along with the table metadata","B":"The data files are moved to a Unity Catalog-managed trash location for 30 days","C":"The data files are retained in cloud storage; only the table metadata (catalog registration) is removed","D":"`DROP TABLE` fails on external tables — you must use `DROP EXTERNAL TABLE`"},"k":"C","e":"External tables in Unity Catalog (and Databricks in general) only store metadata — the table definition pointing to an external cloud storage location. When dropped, only the metadata registration is removed. The underlying data files in S3 or ADLS are untouched. This is the key difference from managed tables, where dropping the table also deletes the data files."},{"n":45,"d":"Medium","q":"A data engineer queries `SELECT * FROM system.access.audit LIMIT 100` and sees events with `actionName = 'getTable'`. What do these events represent?","o":{"A":"Metadata queries where a user read the table's schema or properties","B":"Full table scans where all rows were returned to the user","C":"Table creation events logged when a new table is registered","D":"Failed access attempts where permission was denied"},"k":"A","e":"In Databricks audit logs, `getTable` action events are recorded when a user reads a table's metadata (schema, properties, statistics) — this includes actions like `DESCRIBE TABLE` or when a BI tool queries the catalog for table info. Full data reads are logged as `commandSubmit`/`commandFinish` events. Permission denials are recorded as separate audit events with error details."}];
const sections=[{name:'01 Databricks Intelligence Platform',from:1,to:3},{name:'02 Data Ingestion and Loading',from:4,to:12},{name:'03 Data Transformation and Modeling',from:13,to:22},{name:'04 Working with Lakeflow Jobs',from:23,to:29},{name:'05 Implementing CI/CD',from:30,to:34},{name:'06 Troubleshooting, Monitoring, and Optimization',from:35,to:38},{name:'07 Governance and Security',from:39,to:45}];
let answers={},idx=0,submitted=false,remaining=5400,running=false,last=0;
const $=id=>document.getElementById(id);const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>safe(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
function update(){const n=Object.keys(answers).length;$('progress').textContent=n+' / 45 answered';$('fill').style.width=n/45*100+'%';$('timer').textContent=Math.floor(remaining/60)+':'+String(remaining%60).padStart(2,'0');$('numbers').innerHTML=questions.map((q,i)=>'<button class="'+(answers[q.n]?'answered ':'')+(i===idx?'current':'')+'" data-i="'+i+'">'+q.n+'</button>').join('');$('numbers').querySelectorAll('button').forEach(b=>b.onclick=()=>show(+b.dataset.i))}
function show(i){idx=i;const q=questions[i];let h='<div class="muted">Question '+q.n+' / 45 · '+safe(q.d)+' · '+sections.find(s=>q.n>=s.from&&q.n<=s.to).name+'</div><div class="stem">'+fmt(q.q)+'</div>';for(const [k,v] of Object.entries(q.o))h+='<label class="opt"><input type="radio" name="answer" value="'+k+'" '+(answers[q.n]===k?'checked ':'')+(submitted?'disabled':'')+'><strong>'+k+'.</strong> '+fmt(v)+'</label>';
if(submitted){h+='<div class="feedback"><strong class="'+(answers[q.n]===q.k?'correct':'incorrect')+'">'+(answers[q.n]===q.k?'Correct':'Incorrect')+' · Your answer: '+(answers[q.n]||'Unanswered')+' · Correct answer: '+q.k+'</strong><p><strong>Why the correct answer is right:</strong> '+fmt(q.e)+'</p><strong>Option-by-option review:</strong>';for(const [k,v] of Object.entries(q.o)){h+='<p><strong>'+k+' — '+(k===q.k?'Correct':'Incorrect')+'.</strong> '+(k===q.k?'This matches the required behavior. ':'This option does not satisfy the scenario; compare it with the correct approach described above. ')+fmt(v)+'</p>'}h+='</div>'}
h+='<div class="actions"><button class="btn" id="prev" '+(i===0?'disabled':'')+'>Previous</button><button class="btn primary" id="next" '+(i===44?'disabled':'')+'>Next</button></div>';$('question').innerHTML=h;$('prev').onclick=()=>show(Math.max(0,idx-1));$('next').onclick=()=>show(Math.min(44,idx+1));document.querySelectorAll('input[name=answer]').forEach(el=>el.onchange=()=>{answers[q.n]=el.value;update()});update()}
function finish(){if(submitted)return;const missing=45-Object.keys(answers).length;if(missing&&!confirm('You have '+missing+' unanswered questions. Submit anyway?'))return;if(!missing&&!confirm('Submit all 45 answers and reveal explanations?'))return;submitted=true;running=false;$('submit').disabled=true;const score=questions.filter(q=>answers[q.n]===q.k).length;const stats=sections.map(s=>{let group=questions.filter(q=>q.n>=s.from&&q.n<=s.to),ok=group.filter(q=>answers[q.n]===q.k).length;return {...s,total:group.length,ok,rate:Math.round(ok/group.length*100)}});const weak=stats.filter(x=>x.rate<80).sort((a,b)=>a.rate-b.rate);let h='<h2>Exam results</h2><h2>'+score+' / 45 ('+Math.round(score/45*100)+'%)</h2><p class="muted">Databricks does not publish an official passing score. 32/45 is a practice target, not an official pass threshold.</p><table><tr><th>Domain</th><th>Correct</th><th>Rate</th></tr>'+stats.map(x=>'<tr><td>'+x.name+'</td><td>'+x.ok+'/'+x.total+'</td><td>'+x.rate+'%</td></tr>').join('')+'</table><h2>Areas to strengthen</h2>'+(weak.length?'<p>Prioritize: '+weak.map(x=>x.name+' ('+x.rate+'%)').join('; ')+'</p>':'<p>No domain below 80%. Review individual incorrect questions and any guessed answers.</p>')+'<p>These are small domain samples, so use the incorrect questions to identify specific concepts rather than treating the percentages as precise proficiency measurements.</p><button class="btn primary" id="copy">Copy missed questions for ChatGPT review</button><p id="copystatus"></p><p>All question explanations are now available as you navigate through the exam.</p>';$('summary').innerHTML=h;$('summary').style.display='block';$('copy').onclick=()=>{const wrong=questions.filter(q=>answers[q.n]!==q.k);const txt='Databricks Mock Exam 2: '+score+'/45. Please analyze every missed question, explain why the correct choice is correct and why each of the other three choices is wrong, and summarize my weakest domains and a focused study plan.\n\nDomain scores:\n'+stats.map(x=>x.name+': '+x.ok+'/'+x.total).join('\n')+'\n\nMissed questions:\n'+wrong.map(q=>'Q'+q.n+' ['+sections.find(s=>q.n>=s.from&&q.n<=s.to).name+']\n'+q.q+'\n'+Object.entries(q.o).map(([k,v])=>k+') '+v).join('\n')+'\nMy answer: '+(answers[q.n]||'Unanswered')+'; Correct: '+q.k+'\nOriginal explanation: '+q.e).join('\n\n');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>$('copystatus').textContent='Copied. Paste into ChatGPT.',()=>fallback(txt))}else fallback(txt);function fallback(t){const a=document.createElement('textarea');a.value=t;a.style.width='100%';a.rows=8;$('copystatus').replaceWith(a);a.select();document.execCommand('copy')}};show(idx);$('summary').scrollIntoView({behavior:'smooth'})}
$('submit').onclick=finish;$('start').onclick=()=>{running=true;last=Date.now()};$('pause').onclick=()=>{running=false};setInterval(()=>{if(!running||submitted)return;let now=Date.now(),delta=Math.floor((now-last)/1000);if(delta>0){remaining=Math.max(0,remaining-delta);last+=delta*1000;update();if(!remaining){running=false;alert('90 minutes elapsed. You can submit your answers now.')}}},1000);show(0);
</script></body></html>
